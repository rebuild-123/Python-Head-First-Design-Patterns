name: codex-issue

on:
  issue_comment:
    types: [created]

jobs:
  resolve:
    if: >
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/codex ') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      mode: ${{ steps.parse.outputs.mode }}
      target_branch: ${{ steps.parse.outputs.target_branch }}
      max_rounds: ${{ steps.parse.outputs.max_rounds }}
    steps:
      - name: Parse and validate command
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = context.payload.comment.body.trim();

            const modeMatch = body.match(/^\/codex\s+(plan|implement|review|autopilot)\b/i);
            if (!modeMatch) {
              core.setFailed(
                "Invalid command. Use: /codex <plan|implement|review|autopilot> branch=<branch-name> [max_rounds=1|2|3]"
              );
              return;
            }

            const mode = modeMatch[1].toLowerCase();

            const branchMatch = body.match(/\bbranch=([A-Za-z0-9._\/-]+)\b/i);
            if (!branchMatch) {
              core.setFailed(
                "Missing branch. Use: /codex <plan|implement|review|autopilot> branch=<branch-name>"
              );
              return;
            }

            const branch = branchMatch[1];

            const roundsMatch = body.match(/\bmax_rounds=(\d+)\b/i);
            const maxRounds = roundsMatch ? Number(roundsMatch[1]) : 3;

            const isValidChars = /^[A-Za-z0-9._/-]+$/.test(branch);
            const hasDangerousPattern =
              branch.includes("..") ||
              branch.includes("@{") ||
              branch.startsWith("/") ||
              branch.endsWith("/") ||
              branch.endsWith(".lock");

            if (!isValidChars || hasDangerousPattern) {
              core.setFailed(`Invalid branch name: ${branch}`);
              return;
            }

            const allowedPrefixes = ["codex/", "feature/", "bugfix/", "hotfix/"];
            if (!allowedPrefixes.some(prefix => branch.startsWith(prefix))) {
              core.setFailed(
                `Branch not allowed: ${branch}. Allowed prefixes: ${allowedPrefixes.join(", ")}`
              );
              return;
            }

            if (mode === "autopilot") {
              if (!Number.isInteger(maxRounds) || maxRounds < 1 || maxRounds > 3) {
                core.setFailed("max_rounds must be 1, 2, or 3 for autopilot mode.");
                return;
              }
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              core.setFailed(`Branch does not exist: ${branch}`);
              return;
            }

            core.setOutput("mode", mode);
            core.setOutput("target_branch", branch);
            core.setOutput("max_rounds", String(maxRounds));

      - name: Comment usage on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const usage = [
              "Codex command format is invalid.",
              "",
              "Use one of:",
              "- `/codex plan branch=codex/example`",
              "- `/codex implement branch=codex/example`",
              "- `/codex review branch=codex/example`",
              "- `/codex autopilot branch=codex/example max_rounds=3`",
              "",
              "Allowed branch prefixes:",
              "- `codex/`",
              "- `feature/`",
              "- `bugfix/`",
              "- `hotfix/`",
              "",
              "Process rules:",
              "- `implement` requires an existing latest `plan` comment for the same issue and branch.",
              "- `review` evaluates the latest implementation for the same issue and branch.",
              "- `autopilot` runs bounded retries and still leaves the final merge to human approval.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: usage,
            });

  codex_plan:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'plan'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: rebuild-123/codex-automation/.github/workflows/codex-plan.yml@main
    with:
      target_branch: ${{ needs.resolve.outputs.target_branch }}
      base_branch: ${{ github.event.repository.default_branch }}
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      comment_body: ${{ github.event.comment.body }}
      task: ""
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  codex_implement:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'implement'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: rebuild-123/codex-automation/.github/workflows/codex-implement.yml@main
    with:
      target_branch: ${{ needs.resolve.outputs.target_branch }}
      base_branch: ${{ github.event.repository.default_branch }}
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      comment_body: ${{ github.event.comment.body }}
      task: ""
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  codex_review:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'review'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: rebuild-123/codex-automation/.github/workflows/codex-review.yml@main
    with:
      target_branch: ${{ needs.resolve.outputs.target_branch }}
      base_branch: ${{ github.event.repository.default_branch }}
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      comment_body: ${{ github.event.comment.body }}
      task: ""
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  codex_autopilot:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.mode == 'autopilot'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: rebuild-123/codex-automation/.github/workflows/codex-autopilot.yml@main
    with:
      target_branch: ${{ needs.resolve.outputs.target_branch }}
      base_branch: ${{ github.event.repository.default_branch }}
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      comment_body: ${{ github.event.comment.body }}
      task: ""
      max_rounds: ${{ needs.resolve.outputs.max_rounds }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}