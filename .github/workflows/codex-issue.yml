name: codex-issue

on:
  issue_comment:
    types: [created]

jobs:
  resolve:
    if: >
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/codex ') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      mode: ${{ steps.parse.outputs.mode }}
      target_branch: ${{ steps.parse.outputs.target_branch }}
    steps:
      - name: Parse and validate command
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = context.payload.comment.body.trim();

            const match = body.match(
              /^\/codex\s+(plan|implement|review)\b(?:.*?\bbranch=([A-Za-z0-9._\/-]+))?\s*$/i
            );

            if (!match) {
              core.setFailed(
                "Invalid command. Use: /codex <plan|implement|review> branch=<branch-name>"
              );
              return;
            }

            const mode = match[1].toLowerCase();
            const branch = match[2];

            if (!branch) {
              core.setFailed(
                "Missing branch. Use: /codex <plan|implement|review> branch=<branch-name>"
              );
              return;
            }

            const isValidChars = /^[A-Za-z0-9._/-]+$/.test(branch);
            const hasDangerousPattern =
              branch.includes("..") ||
              branch.includes("@{") ||
              branch.startsWith("/") ||
              branch.endsWith("/") ||
              branch.endsWith(".lock");

            if (!isValidChars || hasDangerousPattern) {
              core.setFailed(`Invalid branch name: ${branch}`);
              return;
            }

            const allowedPrefixes = ["codex/", "feature/", "bugfix/", "hotfix/"];
            if (!allowedPrefixes.some(prefix => branch.startsWith(prefix))) {
              core.setFailed(
                `Branch not allowed: ${branch}. Allowed prefixes: ${allowedPrefixes.join(", ")}`
              );
              return;
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              core.setFailed(`Branch does not exist: ${branch}`);
              return;
            }

            core.setOutput("mode", mode);
            core.setOutput("target_branch", branch);

      - name: Comment usage on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const usage = [
              "Codex command format is invalid.",
              "",
              "Use one of:",
              "- `/codex plan branch=codex/example`",
              "- `/codex implement branch=codex/example`",
              "- `/codex review branch=codex/example`",
              "",
              "Allowed branch prefixes:",
              "- `codex/`",
              "- `feature/`",
              "- `bugfix/`",
              "- `hotfix/`",
              "",
              "Process rules:",
              "- `implement` requires an existing latest `plan` comment for the same issue and branch.",
              "- `review` evaluates the latest implementation for the same issue and branch.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: usage,
            });

  codex:
    needs: resolve
    if: needs.resolve.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: rebuild-123/codex-automation/.github/workflows/codex-issue-runner.yml@main
    with:
      mode: ${{ needs.resolve.outputs.mode }}
      target_branch: ${{ needs.resolve.outputs.target_branch }}
      base_branch: ${{ github.event.repository.default_branch }}
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      comment_body: ${{ github.event.comment.body }}
      task: ""
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}